name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
            artifact: src-tauri/target/**/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            name: macos-x64
            artifact: src-tauri/target/**/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows-x64
            artifact: src-tauri/target/**/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS application signature and disk image
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/release/bundle/macos/Media Archive.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/yt-dlp" --version
          "$app/Contents/MacOS/deno" eval 'console.log(1 + 1)'
          hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: media-archive-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
