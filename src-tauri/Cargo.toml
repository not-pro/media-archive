[package]
name = "media-archive"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "Desktop media archive for authorized offline access"

[lib]
name = "media_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
keyring = "=4.2.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tempfile = "3.27.0"
url = "2.5.8"

[profile.release]
lto = "thin"
strip = "symbols"
