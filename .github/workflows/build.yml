name: build

on:
  workflow_dispatch:
  push:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-arm64
            name: macos-arm64
          - os: macos-15
            name: macos-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: media-archive-${{ matrix.name }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
